<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JS Event Bubbling - KernalPrab</title>
        <style>
            .child {
                background-color: beige;
                padding: 33px;
                margin: 33px;
                cursor: pointer;
            }
            .childContainer {
                background-color: rgb(200, 200, 69);
                padding: 33px;
                margin: 33px;
                cursor: pointer;
            }
            .container {
                background-color: rgb(137, 225, 115);
                padding: 33px;
                margin: 33px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <!-- Main container -->
        <div class="container">
            <!-- Child container inside main container -->
            <section class="childContainer">
                <!-- Child div inside child container -->
                <div class="child">I am a child</div>
            </section>
        </div>

        <script>
            // Add click event to child div
            document.querySelector(".child").addEventListener("click", (e) => {
                e.stopPropagation(); // Prevent event bubbling
                alert("Child was clicked");
            });
            // Add click event to childContainer section
            document
                .querySelector(".childContainer")
                .addEventListener("click", (e) => {
                    e.stopPropagation(); // Prevent event bubbling
                    alert("childContainer was clicked");
                });
            // Add click event to main container
            document.querySelector(".container").addEventListener("click", () => {
                alert("Container was clicked");
            });

            // Function to generate a random RGB color
            function getRandomColor() {
                let val1 = Math.ceil(0 + Math.random() * 255); // Random value for red
                let val2 = Math.ceil(0 + Math.random() * 255); // Random value for green
                let val3 = Math.ceil(0 + Math.random() * 255); // Random value for blue
                return `rgb(${val1}, ${val2}, ${val3})`; // Return RGB color string
            }

            // Change background colors every second
            setInterval(() => {
                document.querySelector(".childContainer").style.backgroundColor = getRandomColor();
                document.querySelector(".container").style.backgroundColor = getRandomColor();
                document.querySelector(".child").style.backgroundColor = getRandomColor();
            }, 1000); 
            // clearInterval() // To stop the interval, use clearInterval()

            // Change child text color after 3 seconds
            setTimeout(() => {
                document.querySelector(".child").style.color = "red";
            }, 3000);
            // clearTimeout() // To stop the timeout, use clearTimeout()
        </script>
    </body>
</html>
